title: Why I Go to Church on Saturday
kind: book
subtitle: Giving Light to Our World
description: >-
  To many, my Saturday church attendance appears to be out of step with the
  Sunday Christian tradition. They wonder how I can be so confused as to go on
  the “wrong day.” So, exactly why do I, and millions like me, choose Saturday
  over Sunday? Consider these three reasons that may surprise you.
