title: 2026 Youth Week of Prayer
kind: devotional
subtitle: Communion in Action
description: The first four commandments in Exodus 20 emphasize obedience and connection with God. The last six commandments underscore the significance of human relationships. The high rate of conversions in the book of Acts also highlights the link between connection with God and human relationships. “Communion in Action” serves as a rallying cry to prioritize devotion to God by studying His Word and to allow the Holy Spirit to guide us into mission.
