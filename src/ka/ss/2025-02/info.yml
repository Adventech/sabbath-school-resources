title: როგორ შევისწავლოთ ბიბლიური წინასწარმეტყველებები
description: >-
  სპარსეთის ყურეში ომის დროს (1990-1991) ერთ ცნობილ პროტესტანტ მქადაგებელს
  დარწმუნებით ეგონა, რომ გამოცხადების წიგნში სწორედ ეს კონფლიქტი იყო
  ნაწინასწარმეტყველები. ვერტმფრენები ამ ომში მას ახსენებდნენ კალიებს გამოცხ.
  9:2,3-დან: „მან გახსნა უფსკრულის ჯურღმული და ამოვარდა კვამლი ჯურღმულიდან,
  როგორც დიდი ღუმლის კვამლი. და დაბნელდა მზე და ჰაერი ჯურღმულის კვამლისაგან.
  კვამლიდან გამოვიდნენ კალიები მიწაზე და მიეცა მათ ძალა, როგორც აქვთ ძალა მიწის
  მორიელთ“.
