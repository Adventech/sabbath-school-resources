title: 'Student YAQ2: God Is With Me'
markdownTitle: 'Student YAQ2: God Is With Me'
subtitle: Year A, Quarter 2
description: >-
  These 13 programs explore the stories of Isaac, Jacob, Joseph, and Naomi and
  Ruth while teaching children that no matter what we face, God is with us.
