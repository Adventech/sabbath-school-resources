title: Living Fruitful Love
kind: devotional
subtitle: Family Togetherness Week of Prayer 2021
description: "Fruit comes in many different shapes, sizes, textures, and tastes. Farmers from around the world make great efforts to grow and produce fruit that will tickle our tongues and satisfy our tastebuds. Some fruits are round like oranges or blueberries. Some are fuzzy like peaches and kiwi. Some are large like papaya and watermelon. And some are tart like cranberries or sweet like mangoes. Producing fruit is no easy task. Many of us simply go to the local grocery store or market and pick up whatever fruit we like for a reasonable price. However, farmers have the difficult task of planting, nurturing, and cultivating the fruit we get to enjoy."
