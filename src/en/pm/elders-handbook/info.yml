title: Elder’s Handbook
kind: book
description: "The work of elders is unique among church leaders. As overseers, they are responsible for everything that is related to the work of the church. As such, the training and directing of elders fall under the Ministerial Association. Because elders work closely with people in all aspects of the church, this handbook includes material from representatives of each department. To the elders in their ministry to the church, the General Conference Ministerial Association leadership and their counterparts in the world divisions present this updated edition of the 1997 Elder’s Handbook. Because this handbook is to be used worldwide, it was sent to General Conference departmental directors, elders, pastors, and administrators for review, input, and suggestions. In consideration of elders in different parts of the world serving in congregations of varying sizes, these basic principles should be applied contextually and locally."
