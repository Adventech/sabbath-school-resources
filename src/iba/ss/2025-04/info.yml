title: Pelajar Senentang Pengarap Ari Joshua
description: >-
  Bup Josua ngelaika alih ari pengiring Moses ngagai pengiring Josua. Iya
  berengkah enggau jerita pasal Israel ti masuk ngagai Tanah Semaya nya lalu
  tembu lebuh maya sida udah ngentapka diri ba menua nya.
