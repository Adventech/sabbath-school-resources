title: တၢ်စူၢ်တၢ်နၥ်အတၢ်မၤလိတဖၣ်လၢ စီၤယိၤရှူအအိၣ်
description: >-
  လံၥ်ယိၤရှူပၥ်ပနီၣ် ခိၣ်နၢ်အတၢ်ဆီတလဲအသးလၢစီၤမိၤၡွဒီး ဆူစီၤယိၤရှူအအိၣ်န့ၣ်လီၤ.
  စးထီၣ်အသးလၢ အမ့ၢ်ပူလၢအံၣ်စ၇့လးနုၥ်လီၤဆူ ကီၢ်တၢ်စံးပၥ်ဒီး
  ကတၢၢ်လၢအဝဲသ့ၣ်အိၣ်ဆိးလၢကီၢ်ပူၤန့ၣ်လီၤ.
human_date: အီးကထိဘၢၣ် · နိၣ်၀့ဘၢၣ် · ဒံၣ်စ့ဘၢၣ် 2025
