title: When God Said Remember
kind: book
description: Do you feel rushed, pressured, and stressed out? There is just too much to do and not enough time for it? However hard you try, there’s always one more task, one more assignment, one more item to check off your to-do list. Let’s introduce to you the concept of the biblical Sabbath.
