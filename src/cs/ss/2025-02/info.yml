title: 'Jak Studovat Biblická Proroctví: Odkazy, obrazy, symboly'
description: "Během první války v\_Perském zálivu (1991) byl známý protestantský spisovatel a\_televizní evangelista Jack Van Impe přesvědčený o\_tom, že tento konflikt předpověděla kniha Zjevení. Jeho argument vycházel z\_toho, že některé bojové helikoptéry vypadaly jako kobylky zobrazené ve\_Zjevení 9: „... otevřela jícen propasti a\_vyvalil se dým jako z\_obrovské pece, a\_tím dýmem se zatmělo slunce i\_všechno ovzduší. Z\_dýmu se vyrojily kobylky na\_zem; byla jim dána moc, jakou mají pozemští škorpióni“ (Zj 9,2.3)."
