title: Ad-adal ti Pammati Manipud ken Josue
description: >-
  Ti libro ti Josue ket tanda ti panagsukat iti pangulo manipud ken Moises a
  napan ken Josue. Dayta ket mangrugi iti istoria ti Israel a sumsumrek iti
  Naikari a Daga ken agpatingga kadakuada a nakasimpa iti dayta a daga.
