description: Fear is an emotion. Faith is an attitude, and focus is a choice. Fear must give way to faith as we adjust our focus. Discover with Pastor Mark Finley as he shows us that we have One who is larger than our fears, bigger than our worries, and greater than our anxieties by our side.
