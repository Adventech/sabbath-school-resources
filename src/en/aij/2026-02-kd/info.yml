title: 'Student YAQ2: God Is With Me'
markdownTitle: 'Student YAQ2: God Is With Me'
subtitle: Year A, Quarter 2
description: "Meet God’s friends, Isaac, Jacob, Joseph, Naomi, and Ruth, in these beautiful Bible lessons. You’ll learn how God was with them through their ups and downs, and He will be with you too!"
