title: Lekcje wiary Płynące z Księgi Jozuego
description: >-
  Księga Jozuego. Księga Jozuego zaczyna się zmianą na stanowisku przywódcy
  Izraela. Po odejściu Mojżesza jego rolę przejmuje Jozue. Na początku księgi
  Izraelici wkraczają do Ziemi Obiecanej, a pod jej koniec obejmują Kanaan w
  posiadanie.
