title: 'Aluno: Meu Deus é Amor — Ano A, Trimestre 1'
markdownTitle: 'Aluno: Meu Deus é Amor — Ano A, Trimestre 1'
subtitle: Ano A, Trimestre 1
description: "Este trimestre explora as histórias da criação, a queda de Lúcifer, a escolha de Adão e Eva no Jardim do Éden, Caim e Abel, Noé, a Torre de Babel, Abraão e o bebê Isaque."
