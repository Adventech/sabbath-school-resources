title: 'Student YAQ3: Jesus Is My God'
markdownTitle: 'Student YAQ3: Jesus Is My God'
subtitle: Year A, Quarter 3
description: "Find out how God’s rescue plan unfolded through the story of Jesus, God’s Son. You’ll learn about His amazing birth, baptism, temptation, calling of disciples, early miracles, and work for God."
