title: Tro i Josvabogen
description: >-
  Efter Moses’ død overdrages ansvaret for ledelsen af Guds folk til Josva. I
  begyndelsen af Josvabogen sætter israelitterne for første gang fod i det
  forjættede land, og hen mod slutningen har de etableret sig i landet.
