title: 2025 Youth Week of Prayer
kind: devotional
subtitle: A Community Transformed
description: "Global Youth Week of Prayer, an annual event organized by the department of Adventist Youth Ministries (AYM) of the General Conference (GC) of Seventh-Day Adventists, is just around the corner. With Global Youth Day (GYD) set to launch the event on March 15, 2025, this annual celebration promises to be impactful for youth worldwide. The 2025 week of prayer theme is ACT: “A Community Transformed.” The focus is on reaching the challenging territories of this world, the 10/40 window, with the word of God."
primaryColor: '#286173'
primaryColorDark: '#0D4B5E'
startDate: 15/03/2025
endDate: 22/03/2025
credits:
