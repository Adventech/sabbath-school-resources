title: 1 и 2 Коринтяни
description: >-
  Писането на писма е дейност, практикувана от векове, която не е отживелица.
  Просто сме променили начина, по който се пишат писмата. Да, социалните мрежи
  изместиха хартията. Въпреки това по същество имейлите и другите форми на
  електронни писма изпълняват основно същата функция: те свързват хората чрез
  обмен на информация, чувства и мисли.
