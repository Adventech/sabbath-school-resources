title: Dar proroctva
description: "Vedci skúmajúci mozog začínajú rozumieť obdivuhodnej schopnosti malých detí učiť sa jazyk. Už polročné bábätko vníma zvuky tvoriace jeho materinský jazyk. Ak je v\_kontakte s\_ďalšou rečou, osvojí si aj tú. V\_tomto veku sa v\_mysli dieťaťa otvára neznámy priestor, vďaka ktorému odlíši zhruba štyridsať zvukov materinského jazyka od asi osemsto rozličných zvukov, ktoré vníma hneď po narodení. Podmienkou však je, aby sme sa bábätkám prihovárali. Ide o\_akési „hlasové lekcie“ pre novorodencov."
