title: 'Student YBQ1: God’s Way Is Best'
markdownTitle: 'Student YBQ1: God’s Way Is Best'
subtitle: Year B, Quarter 1
description: >-
  Journey with Moses and God’s people as God saves them from slavery, and their
  enemies, as they start their trek toward the Promised Land. You’ll learn about
  God’s care, protection, leading, and the laws of love He’s given us. God’s way
  is truly best!
