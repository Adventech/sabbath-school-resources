title: 'Adoracão: De volta ao altar'
description: >-
  Tudo começou durante meu primeiro ano do ensino médio, quando eu tinha 15
  anos. Na época, meu comportamento não era dos melhores, e meus pais decidiram
  que eu precisava mudar de ambiente. Então, me enviaram para a Pine Forge
  Academy, um internato adventista localizado em uma área rural do estado da
  Pensilvânia (EUA).
