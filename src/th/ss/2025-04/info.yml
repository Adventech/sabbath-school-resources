title: บทเรียนแห่งความเชื่อจากพระธรรมโยชูวา
description: >-
  พระธรรมโยชูวาเป็นจุดเปลี่ยนผ่านจากการนำของโมเสสมาสู่การนำของโยชูวา
  เรื่องราวเริ่มต้นด้วยเหตุการณ์ที่ชนชาติอิสราเอลเข้าสู่แผ่นดินแห่งพันธสัญญา
  และสิ้นสุดลงเมื่อพวกเขาตั้งถิ่นฐานในแผ่นดินนั้น
