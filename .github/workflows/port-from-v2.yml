name: port-from-v2

on:
  repository_dispatch:
    types: [trigger-workflow]

jobs:
  port-from-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        name: Fetch the repository files
        with:
          ref: stage
          fetch-depth: 0
          persist-credentials: false
      - name: Validate port identifier
        id: validate-port-id
        shell: bash
        env:
          RAW_PORT_ID: ${{ github.event.client_payload.port_id }}
        run: |
          if [[ ! "$RAW_PORT_ID" =~ ^[A-Za-z0-9_-]{1,64}$ ]]; then
            echo "Invalid port identifier" >&2
            exit 1
          fi
          printf 'port_id=%s\n' "$RAW_PORT_ID" >> "$GITHUB_OUTPUT"
      - name: Create port dir
        run: mkdir port
      - name: Sync ported content from s3
        run: aws s3 cp "s3://sabbath-school-media-tmp/port/ss-${PORT_ID}/" ./port --recursive --region us-east-1
        env:
          PORT_ID: ${{ steps.validate-port-id.outputs.port_id }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Running rsync
        run: rsync -a ./port/ ./src/
      - name: Remove port dir
        run: rm -r ./port
      - name: Git Add all new files
        run: git add -A
      - name: Reset yarn.lock
        run: git restore yarn.lock
      - name: Commit & Push changes
        env:
          INPUT_GITHUB_TOKEN: ${{ secrets.PERSONAL_GH_TOKEN }}
        run: |
          timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          remote_repo="https://${GITHUB_ACTOR}:${INPUT_GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git config http.sslVerify false
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "chore: autopublish ${timestamp}" || exit 0
          
          for i in $(seq 1 5); do
            git pull --no-rebase "${remote_repo}" stage && git push "${remote_repo}" HEAD:"stage" && break
            echo "Retry $i..."
            sleep $((RANDOM % 5 + 1))
          done
