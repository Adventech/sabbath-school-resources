title: Toinen Mooseksen kirja
description: >-
  Toisessa Mooseksen kirjassa ilmaistu Jumala on rakastava Herra, joka
  määrättynä ajankohtana – ja mahtavien tekojensa kautta – pelasti ja vapautti
  kansansa (1. Moos. 15:12–16). Pako Egyptistä ja Punaisenmeren ylitys olivat
  käänteentekeviä ja ainutlaatuisia tapahtumia – Jumalan näyttäviä ja
  ihmeellisiä tekoja. Mitään suurempaa tai ihmeellisempää ei ollut koskaan
  tapahtunut muinaisen Israelin historiassa ennen Jeesuksen ristiä. Aiheena on
  evankeliumi Mooseksen mukaan.
