title: 2025 Quarterly Days of Prayer and Fasting
kind: devotional
subtitle: 'Pray Like Daniel: Inspiration for Last-day Praying'
description: >-
  Bold prayers and their incredible answers are woven into the stories and
  prophecies of Daniel. As we examine the prophet’s prayers, we will find that
  the power to move God is not found simply in the words we use but also in the
  life we live. We will also see the potent results of persistent, Holy
  Spirit-led prayer. Heaven itself listens and answers! Join us as we learn to
  pray like Daniel.
primaryColor: '#48526F'
primaryColorDark: '#262F49'
startDate: 05/01/2025
endDate: 31/12/2025
