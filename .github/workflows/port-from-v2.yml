name: port-from-v2

on:
  repository_dispatch:
    types: [trigger-workflow]

jobs:
  port-from-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        name: Fetch the repository files
        with:
          ref: stage
          fetch-depth: 0
          persist-credentials: false
      - name: Create port dir
        run: mkdir port
      - name: Sync ported content from s3
        run: aws s3 cp s3://sabbath-school-media-tmp/port/ss-`echo '${{ github.event.client_payload.port_id }}'`/ ./port --recursive --region us-east-1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Running rsync
        run: rsync -a ./port/ ./src/
      - name: Remove port dir
        run: rm -r ./port
      - name: Git Add all new files
        run: git add -A
      - name: Reset yarn.lock
        run: git restore yarn.lock
      - name: Commit & Push changes
        env:
          INPUT_GITHUB_TOKEN: ${{ secrets.PERSONAL_GH_TOKEN }}
        run: |
          timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          remote_repo="https://github.com/${GITHUB_REPOSITORY}.git"
          git_credential_helper="$(mktemp)"

          cleanup_git_credentials() {
            git config --local --unset-all credential.helper || true
            rm -f "$git_credential_helper"
          }
          trap cleanup_git_credentials EXIT

          cat > "$git_credential_helper" <<'EOF'
          #!/usr/bin/env bash
          if [ "$1" = "get" ]; then
            printf '%s\n' "username=x-access-token"
            printf '%s\n' "password=${INPUT_GITHUB_TOKEN}"
          fi
          EOF
          chmod 700 "$git_credential_helper"
          git config --local credential.helper "$git_credential_helper"

          git config http.sslVerify false
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "chore: autopublish ${timestamp}" || exit 0
          
          for i in $(seq 1 5); do
            git pull --no-rebase "${remote_repo}" stage && git push "${remote_repo}" HEAD:"stage" && break
            echo "Retry $i..."
            sleep $((RANDOM % 5 + 1))
          done