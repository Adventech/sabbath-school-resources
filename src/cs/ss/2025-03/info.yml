title: 'Exodus: Cesta do zaslíbené země'
description: >-
  Bůh zjevený v druhé knize Mojžíšově – Exodu – je milující Hospodin, který v
  určeném čase –  a mocnými činy – zachránil a vysvobodil svůj lid (Gn
  15,12–16). Vyjití z Egypta a přechod Rudého moře byly zásadní a jedinečné
  události. Byly to velkolepé a úžasné Boží činy a zázraky. Před událostmi na
  kříži se v dějinách starověkého Izraele neodehrála žádná větší nebo slavnější
  událost. Knihu Exodus lze také nazvat evangeliem podle Mojžíše.
