title: Am I Good Enough?
kind: book
subtitle: Giving Light to Our World
description: >-
  Ryan grew up a religious person. He enjoyed having a little fun here and
  there, a harmless practical joke now and then. But he regularly attended
  worship services. He married a lovely woman, and they sang beautifully
  together as she played the old piano. They mostly performed songs about God’s
  love. Their favorite said, “I’ve wandered far away from God; now I’m coming
  home.”
