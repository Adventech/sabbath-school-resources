title: 'Vantung leh Leitung Gawmtuah: Filippi leh Kolose sung aa Khris'
description: >-
  Na nasep ngeiteng lakpan a haksa pen ngaihsun in. Bangin haksa sak hiam? Nang’
  lam-etna hang maw, hun hong kitawm piaklua maw, a nihmah maw? Tua vaipuak
  tungah nangma lungsim puak maw? Naseppihte hang hizaw maw? A kizo ngeilo ding
  nasep ahih hang maw leh?
