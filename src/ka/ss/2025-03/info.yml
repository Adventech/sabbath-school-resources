title: 'გამოსვლა: მოგზაურობა აღთქმული ქვეყნისკენ'
description: >-
  გამოსვლის წიგნი – მოსეს სახარებაა. მასში ღმერთი წარმოდგენილია, როგორც
  მოსიყვარულე უფალი, რომელმაც, განსაზღვრულ დროს, თავისი გასაოცარი ქმედებებით
  ხსნა და თავისუფლება მიანიჭა საკუთარ ხალხს (დაბ. 15:12-16). ეგვიპტიდან გამოსვლა
  და წითელი ზღვის გადალახვა (ებრ. იამ სუფ – ლერწმის ზღვა) საკვანძო და უჩვეულო
  მოვლენებია ძველი ისრაელის ისტორიაში – ეს ღმერთის მეტად მნიშვნელოვანი და
  საოცარი საქმეებია
