title: Myths About Hell
kind: book
subtitle: Giving Light to Our World
description: >-
  For most people, hell is simply one of a few four-letter words heard daily in
  the rage of rush hour traffic or the heated scenes of a Hollywood movie. For
  others, the word hell brings back vivid childhood imaginations of an eternal
  roasting pit for humans as described by a church pastor or fiery
  televangelist. Most of us, it seems, would be quite content if the concept of
  hell just didn’t exist. In an attempt to rid their minds of such a fearful
  idea, some make the choice to disbelieve in the idea of hell altogether. This
  often leads to the next step—choosing to disbelieve in a God who would create
  such a place.
