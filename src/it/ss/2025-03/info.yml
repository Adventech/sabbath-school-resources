title: Il libro dell’Esodo
description: >-
  Il Dio rivelato nel libro dell’Esodo è il Signore amorevole che, al momento
  stabilito e con le sue potenti azioni, ha portato la salvezza e la liberazione
  al popolo d’Israele (Ge 15:12-16).
