title: Friends With Jesus
markdownTitle: '^[Friends with]({"style": {"text": {"typeface": "HegelPro-Regular","size": "sm", "color":"#FFFFFF"}}})\

^[Jesus]({"style": {"text": {"typeface": "HeavenlyJoyful", "size": "xl","color":"#FFFFFF"}}})'
description: >-
  Find out how God’s rescue plan unfolded through the story of Jesus, God’s Son.
  You’ll learn about His amazing birth, baptism, temptation, calling of
  disciples, early miracles, and work for God.
primaryColor: '#244A9D'
primaryColorDark: '#173B8B'
