title: 'Nyerakupka Serega enggau Dunya: Kristus dalam Pilipi enggau Kolosi'
description: >-
  Perundingka pengawa ke pemadu pedis udah dikereja nuan. Nama ti ngasuh iya
  pedis? Kati nya ketegal pengarap ati orang, tauka timpuh ti diberi kena
  ngereja iya, tauka kedua-dua nya sekali? Kati nya ketegal sikap nuan senentang
  pengawa nya? Tauka ketegal orang ke enggau nuan ngereja pengawa nya? Tauka
  pengawa nya baka ti nadai jalai ulih dikereja enggau mujur, kini?
