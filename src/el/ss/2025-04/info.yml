title: Μαθήματα Πίστης από τον Ιησου Του Ναυη
description: >-
  Το βιβλίο του Ιησού του Ναυή σηματοδοτεί τη μετάβαση από την ηγεσία του Μωυσή
  σε αυτήν του Ιησού του Ναυή. Ξεκινά με την είσοδο των Ισραηλιτών στη Γη της
  Επαγγελίας και καταλήγει με την εγκατάστασή τους στη γη αυτή.
