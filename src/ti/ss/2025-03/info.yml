title: ዘፀኣት
description: >-
  እቲ ኣብ መፅሓፈ ዘፅኣት ዝተገልፀ ኣምላኽ ኣብቲ ምዱብ ግዚኡን ብሓያል ክእለቱን ንህዝቡ ምድሓን ዘምፅአ ፈቃር ጎይታ እዩ
  (ዘፍ 15:12–16)። ምውፃእ ካብ ግብፅን ምሕላፍ ቀይሕ ባሕሪን ኣገደስትን ፍሉያትን ፍፃመታት እዮም ነይሮም፣ እዚ ኸኣ
  እቲ ኣምላኽ ዝገበሮ መስተንክርን ዜደንቕን ተግባራት እዩ። ኣብ ታሪኽ ጥንታዊት እስራኤል ቅድሚ መስቀል ካብዚ ዝዓቢ ወይ
  ዝኸበረ ፍፃመ ኣይተፈፀመን።እዚ ብመሰረት ሙሴ ዝተገልፀ ወንጌል እዩ።
