title: Teacher Guide
subtitle: A Sabbath School Teacher Guide for Babies 0–12 Months
primaryColor: '#E8E9E0'
primaryColorDark: '#AF7852'
description: "There may be only two babies in your church, but you can still run a Babies class! Find a small corner in a quiet room. You don't need to have a fancy classroom--just a space where parents can bring their babies each week. The four programs in the teacher guide are the same programs that are outlined in the Parent Book, with just a few additional Sabbath songs or group activities. Part 1 of the program is for the babies. Part 2 is a spiritual parenting small group."
