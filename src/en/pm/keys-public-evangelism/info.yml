title: Public Evangelism
kind: book
description: Public evangelism is active, intentional preaching through words combined with loving actions, portraying God’s good news to those who need Christ. This booklet outlines the steps for a complete cycle of evangelism, including Personal preparation, Preparing the soil, Planting the seed, Cultivating the harvest, The harvest, and Preserving the harvest
