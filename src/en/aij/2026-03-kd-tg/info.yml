title: 'Teacher YAQ3: Jesus Is My God'
markdownTitle: 'Teacher YAQ3: Jesus Is My God'
subtitle: Year A, Quarter 3
description: "Share with the children the amazing truth that Jesus is our Rescuer and God. These lessons focus on the joyous start of the gospels with the story of Jesus’ birth, baptism, temptation, calling of disciples, early miracles, and work for God."
