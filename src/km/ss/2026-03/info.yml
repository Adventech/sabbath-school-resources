title: ព្រះគម្ពីរកូរិនថូសទី១ និងទី២
description: >-
  ការសរសេរលិខិត គឺជារឿងពីសម័យមុន ប៉ុន្តែយើងមិនទាន់បោះបង់ចោលនៅឡើយទេ។
  យើងគ្រាន់តែបានផ្លាស់ប្តូរវិធីសរសេរតែប៉ុណ្ណោះ។ មែនហើយ
  សព្វថ្ងៃនេះបណ្តាញសង្គមត្រូវបានប្រើជំនួសក្រដាស។ ទោះជាយ៉ាងណា
  ក្នុងសារៈសំខាន់នៃការសរសេរសំបុត្រ ទោះតាមអ៊ីម៉ែល ឬតាមទម្រង់ណាផ្សេងក្ដី
  វាមានគោលបំណងជាមូលដ្ឋានដូចគ្នាគឺ សម្រាប់ភ្ជាប់ទំនាក់ទំនងរបស់មនុស្ស
  តាមរយៈការផ្លាស់ប្តូរព័ត៌មាន អារម្មណ៍ និងគំនិតជាដើម។
