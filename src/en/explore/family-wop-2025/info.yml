title: God’s Great Gifts
kind: devotional
subtitle: Family Togetherness Week of Prayer 2025
description: "In the beginning, God’s heart overflowed with love, and that love found its ultimate expression in three magnificent gifts that would crown His work of creation: marriage, family, and the Sabbath. While the first six days of creation week reveal God’s power and artistry in forming the physical world, it is these three divine institutions that reveal the very heart of His character and His deepest desires for humanity."
