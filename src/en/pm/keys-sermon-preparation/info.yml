title: Sermon Preparation
kind: book
description: If you have been asked to preach a sermon, but you don’t know where to begin, this resource is your guide to success. This book contains seven things to know before you begin to preach and ten steps to preparing a sermon. You will discover how to choose a topic, select supporting texts, organize your information, find illustrations, and more.
