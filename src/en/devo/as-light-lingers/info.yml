title: As Light Lingers
kind: book
subtitle: Basking in the Word of God
description: >-
  This book underlines the importance of studying the Word prayerfully, inviting
  and allowing the Spirit to change you and use you according to God's will. In
  it, you will discover how basking in the power of God’s Word will make you
  want to linger with God—because time with Him is so sweet.
