name: sync-stage-into-prod
on:
  workflow_dispatch:
  schedule:
    - cron: '45 1,7 * * *'
jobs:
  sync-stage-into-master:
    if: (github.repository == 'Adventech/sabbath-school-resources' && github.ref_name == 'stage')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        name: Setup Node
        with:
          node-version: '24.18.0'
      - name: Verify immutable stage revision
        run: node ops/ci/promotion-checks.js
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROMOTION_REPOSITORY: ${{ github.repository }}
          PROMOTION_RUN_ID: ${{ github.run_id }}
          PROMOTION_SHA: ${{ github.sha }}
      - name: Merge stage revision
        uses: devmasx/merge-branch@master
        with:
          type: now
          head_to_merge: ${{ github.sha }}
          target_branch: prod
          github_token: ${{ secrets.PERSONAL_GH_TOKEN }}
