title: Methods of Door-to-Door Visitation
kind: book
description: Many people today turn away from door-to-door witnessing. However, Ellen White wrote that it is “the most essential work that can be done.” If you want to witness door-to-door but don’t know how to begin, this book is for you. Learn from Christ’s example as you connect with your community and visit with people who have requested Bible studies.
