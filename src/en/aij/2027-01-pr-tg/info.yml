title: 'Teacher YBQ1: God’s Way Is Best'
markdownTitle: 'Teacher YBQ1: God’s Way Is Best'
subtitle: Year B, Quarter 1
description: "God always wants the best for His people. Share with the children the story of Moses and the children of Israel as God delivers them from slavery and leads them toward the Promised Land. The lessons explore God’s deliverance, provision, leading, and the Ten Commandments He’s given in love."
