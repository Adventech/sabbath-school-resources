title: Отворена Книга
description: >-
  Целта на Cornerstone Connections е да ви отведе до Библията, за да видите
  голямата история за Бог и хората. Тази голяма история продължава от първото
  поколение в Едем до вашето поколение днес. Става въпрос за живота на хората,
  докато Богът на Вселената взаимодейства с тях.
