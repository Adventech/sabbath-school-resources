name: deploy-podcasts
on:
  schedule:
    - cron: '0 3 * * 0'
    - cron: '0 7 * * 0'
  workflow_dispatch:
jobs:
  deploy-podcasts:
    if: (github.repository == 'Adventech/sabbath-school-resources')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        name: Fetch the repository files
        with:
          ref: prod
      - uses: actions/setup-node@v3
        name: Setup Node
        with:
          node-version: '24'
      - name: Add token for private packages
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.PACKAGES_SECRET }}" >> .npmrc
      - run: npm install --global yarn
        name: Install Yarn
      - run: yarn install
        name: Installing dependencies
      - run: node ./ops/deploy/deploy-podcasts.js
        env:
          DEPLOY_ENV: prod
      - run: aws s3 cp dist/ s3://sabbath-school.adventech.io/assets/xml --acl "public-read" --region us-east-1 --no-progress --recursive
        if: hashFiles('dist/') != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Invalidation
        if: hashFiles('dist/') != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SSPM_DIST_ID: ${{ secrets.SSPM_CLOUDFRONT_DISTRIBUTION_ID }}
          AIJ_DIST_ID: ${{ secrets.AIJ_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          DISTRIBUTIONS=("$SSPM_DIST_ID" "$AIJ_DIST_ID")

          for DIST in "${DISTRIBUTIONS[@]}"; do
            echo ">>> Distribution: $DIST"
            echo "  Invalidating /assets/xml/*..."
            INVALIDATION_ID=$(aws cloudfront create-invalidation \
              --distribution-id "$DIST" \
              --paths "/assets/xml/*" \
              --query 'Invalidation.Id' \
              --output text)
            echo "  Waiting for invalidation $INVALIDATION_ID to complete..."
            aws cloudfront wait invalidation-completed \
              --distribution-id "$DIST" \
              --id "$INVALIDATION_ID"
            echo "  Done."
          done