title: Sabbath School Teaching
kind: book
description: >-
  Sabbath School Teaching is an easy-to-read compilation of Ellen G. White’s
  advice for those involved with the Sabbath School program. Learn about
  creating a non-judgmental climate, selection of teachers, successful soul
  winning, and much more. This book is a must-read for Sabbath School teachers
  wishing to cultivate workers for Christ’s kingdom.
