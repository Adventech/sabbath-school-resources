title: Rebuilding the Family Altar
kind: devotional
subtitle: Family Togetherness Week of Prayer 2022
description: "How do we rebuild altars in 2022? What are the altars of Baal in our homes today that need to be destroyed so that God’s altar can be rebuilt? How can we teach our children and families to worship God and rebuild the family altar as Elijah rebuilt the altar in his day? In our homes today, there is a deep yearning for connection. Many family relationships have been broken and need to be restored. We need modern-day Elijahs in homes that desperately need hope, healing, and heart-turning. We need to restore our relationship with the one true God, Jehovah, the only one who can bring true peace, hope, and healing to our hearts and homes."
primaryColor: '#2C6DE6'
primaryColorDark: '#0E4CBF'
startDate: 05/09/2022
endDate: 11/09/2022
author: afm
