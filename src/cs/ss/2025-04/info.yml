title: Jozue příběh víry a odvahy
description: >-
  Úvodní část knihy Jozue se zaměřuje na změnu ve vedení Izraelců, kdy se po
  Mojžíšově smrti ujímá vedení Jozue. Kniha začíná příběhem o vstupu Izraelců do
  zaslíbené země a končí tím, že se v této zemi skutečně usadí.
