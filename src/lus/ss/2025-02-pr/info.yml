title: Year B. Second Quarter.
description: >-
  Hêng Sabbath Sikul zirlâite hi nangmahni duhsak êm êmtute’n an ziahsak che u a
  ni a. Nangmahni leh in chhûngte nên khân Pathianin a hmangaih che u tih leh,
  amah Pathian chanchin tam zâwk in lo hriat duhin an ziahsak che u a ni.
  Chutiang tho chu Pathian pawhin aduhsak che u a. A hmangaih êm êm che u a ni
  tih in hriat ngei hi a duh a ni.
